name: Build and package Windows x64
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build and run deterministic plus Windows integration tests
        shell: pwsh
        run: ./scripts/Build.ps1 -WindowsIntegration
      - name: Download pinned official Inno Setup
        shell: pwsh
        run: ./scripts/Get-InnoSetup.ps1
      - name: Publish self-contained packages
        shell: pwsh
        run: ./scripts/Publish.ps1 -InnoCompiler "$pwd/.tools/inno/ISCC.exe"
      - name: Package corresponding source
        shell: pwsh
        run: ./scripts/SourceArchive.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StartFlow-win-x64
          if-no-files-found: error
          path: |
            artifacts/*-Setup.exe
            artifacts/*-Portable.zip
            artifacts/*-Source.zip
            artifacts/SHA256SUMS.txt
